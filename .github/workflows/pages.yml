name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inject the hosted app URL
        env:
          ROOK_APP_URL: ${{ vars.ROOK_APP_URL }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const file = 'landing/index.html'
          const raw = (process.env.ROOK_APP_URL ?? '').trim()
          let appUrl = ''

          if (raw) {
            try {
              const parsed = new URL(raw)
              if (parsed.protocol === 'https:' || parsed.protocol === 'http:') {
                appUrl = parsed.toString()
              }
            } catch {
              console.warn('ROOK_APP_URL is not a valid URL; the landing page will show a disabled launch button.')
            }
          }

          const escaped = appUrl
            .replaceAll('&', '&amp;')
            .replaceAll('"', '&quot;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')

          const html = readFileSync(file, 'utf8')
          writeFileSync(file, html.replaceAll('__ROOK_APP_URL__', escaped))
          console.log(appUrl ? `Landing page will link to ${appUrl}` : 'No ROOK_APP_URL repository variable set.')
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the landing page
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
